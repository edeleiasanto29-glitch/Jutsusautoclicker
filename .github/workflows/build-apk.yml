name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q JutsuAutoClicker-final.zip -d projeto

          ROOT=$(find projeto -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Nao encontrei settings.gradle dentro do ZIP"
            find projeto -maxdepth 3 -type f
            exit 1
          fi

          ROOT=$(dirname "$ROOT")
          echo "Projeto encontrado em: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: JutsuAutoClicker-debug-apk
          path: "${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk"
